name: Verify published extension release

on:
  workflow_call:
    inputs:
      version:
        description: Exact published version without v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version without v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-published:
    name: Verify both extension registries
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify exact Marketplace and Open VSX versions
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: pnpm release:verify-published -- "$VERIFY_VERSION"
